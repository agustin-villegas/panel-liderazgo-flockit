[project]
name = "panel-backend"
version = "0.1.0"
description = "API del Panel único de liderazgo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.141.1",
    "google-adk>=2.11.0",
    "httpx>=0.28.1",
    "litellm>=1.104.2",
    "mcp>=2.3.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F errores · I imports · N nombres · UP modernización · B bugs · SIM simplificación · S seguridad
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # tildes y ñ en strings/comentarios

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y claves de prueba

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
